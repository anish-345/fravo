name: Build & Sign Android (Concurrent & Cached)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-artifacts:
    name: 🔨 ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'playstore-bundle'
            name: 'Play Store Release Bundle (AAB)'
            command: 'flutter build appbundle --release'
            src_path: 'build/app/outputs/bundle/release/app-release.aab'
            dest_name: 'fravo-playstore-release.aab'

          - target: 'release-apk'
            name: 'Production Release APK'
            command: 'flutter build apk --release'
            src_path: 'build/app/outputs/flutter-apk/app-release.apk'
            dest_name: 'fravo-release.apk'

          - target: 'debug-bundle'
            name: 'Debug Bundle (AAB)'
            command: 'flutter build appbundle --debug'
            src_path: 'build/app/outputs/bundle/debug/app-debug.aab'
            dest_name: 'fravo-debug.aab'

          - target: 'debug-apk'
            name: 'Debug Testing APK'
            command: 'flutter build apk --debug'
            src_path: 'build/app/outputs/flutter-apk/app-debug.apk'
            dest_name: 'fravo-debug.apk'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Set up Gradle & Dependency Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚡ Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 🔑 Restore Android Keystore & Key Properties
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RAW_KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi

          # Sanitize secret inputs from trailing whitespaces/newlines
          KEYSTORE_PASSWORD=$(echo "$RAW_KEYSTORE_PASSWORD" | tr -d '\r\n ')
          KEY_PASSWORD=$(echo "$RAW_KEY_PASSWORD" | tr -d '\r\n ')
          KEY_ALIAS=$(echo "$RAW_KEY_ALIAS" | tr -d '\r\n ')

          # Decode keystore safely
          echo "$RAW_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/fravo-release.jks

          # Validate keystore integrity and alias
          keytool -list -keystore android/app/fravo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"
          echo "✅ Keystore restored and validated successfully."

          # Generate unindented android/key.properties
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=fravo-release.jks\n" \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

          echo "✅ android/key.properties configured successfully."

      - name: 📄 Restore google-services.json (if provided via secrets)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ google-services.json updated from GitHub Secrets."
          else
            echo "ℹ️ Using repository google-services.json."
          fi

      - name: 🔧 Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🛠️ Execute Concurrent Build Target (${{ matrix.name }})
        run: ${{ matrix.command }}

      - name: 🔍 Verify Signature & Stage Artifact
        run: |
          mkdir -p output
          if [ ! -f "${{ matrix.src_path }}" ]; then
            echo "::error::Build output artifact ${{ matrix.src_path }} not found!"
            exit 1
          fi

          echo "================ Verification Report ================"
          echo "Verifying certificate on ${{ matrix.src_path }}..."
          keytool -printcert -jarfile "${{ matrix.src_path }}" | grep -E "Owner:|SHA256:|SHA1:" || true

          cp "${{ matrix.src_path }}" "output/${{ matrix.dest_name }}"
          echo "✅ Copied to output/${{ matrix.dest_name }}"

      - name: 📤 Upload Build Target Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dest_name }}
          path: output/${{ matrix.dest_name }}
          retention-days: 30

  publish-and-release:
    name: 📦 Package & Aggregate All Signed Artifacts
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: 📝 Generate SHA-256 Checksums
        run: |
          cd dist
          echo "===== Artifact Inventory ====="
          ls -lh
          sha256sum * > SHA256SUMS.txt
          echo "===== SHA-256 Checksums ====="
          cat SHA256SUMS.txt

      - name: 📤 Upload Unified Artifact Bundle
        uses: actions/upload-artifact@v4
        with:
          name: fravo-all-signed-builds-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: 🚀 Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
