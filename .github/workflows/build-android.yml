name: Build & Sign Android (Debug & Release)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - release
          - debug

permissions:
  contents: write

jobs:
  build-and-sign:
    name: 🚀 Build & Sign Android Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Restore Android Keystore & Key Properties
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RAW_KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi

          # Clean secrets of any unwanted carriage returns or whitespaces
          KEYSTORE_PASSWORD=$(echo "$RAW_KEYSTORE_PASSWORD" | tr -d '\r\n ')
          KEY_PASSWORD=$(echo "$RAW_KEY_PASSWORD" | tr -d '\r\n ')
          KEY_ALIAS=$(echo "$RAW_KEY_ALIAS" | tr -d '\r\n ')

          # Decode production keystore safely
          echo "$RAW_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/fravo-release.jks

          # Validate keystore integrity and alias
          keytool -list -keystore android/app/fravo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"
          echo "✅ Keystore restored and validated successfully."

          # Create android/key.properties with clean unindented formatting
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=fravo-release.jks\n" \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

          echo "✅ android/key.properties configured successfully."

      - name: 📄 Restore google-services.json (if provided via secrets)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ google-services.json updated from GitHub Secrets."
          else
            echo "ℹ️ Using existing repository google-services.json."
          fi

      - name: 🔧 Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🛠️ Build Release App Bundle (AAB)
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'release' || github.event.inputs.build_target == null }}
        run: flutter build appbundle --release

      - name: 🛠️ Build Release APK
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'release' || github.event.inputs.build_target == null }}
        run: flutter build apk --release

      - name: 🛠️ Build Debug App Bundle (AAB)
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == null }}
        run: flutter build appbundle --debug

      - name: 🛠️ Build Debug APK
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'debug' || github.event.inputs.build_target == null }}
        run: flutter build apk --debug

      - name: 🔍 Verify Signatures on Output Artifacts
        run: |
          echo "================ Verification Report ================"
          mkdir -p dist

          check_sig() {
            local file_path="$1"
            local dest_name="$2"
            if [ -f "$file_path" ]; then
              echo ">>> Checking signature for: $file_path"
              keytool -printcert -jarfile "$file_path" | grep -E "Owner:|SHA256:|SHA1:" || true
              cp "$file_path" "dist/$dest_name"
              echo "✅ Copied to dist/$dest_name"
            else
              echo "⚠️ File not found: $file_path"
            fi
          }

          check_sig "build/app/outputs/bundle/release/app-release.aab" "fravo-release.aab"
          check_sig "build/app/outputs/flutter-apk/app-release.apk" "fravo-release.apk"
          check_sig "build/app/outputs/bundle/debug/app-debug.aab" "fravo-debug.aab"
          check_sig "build/app/outputs/flutter-apk/app-debug.apk" "fravo-debug.apk"

          echo "================ Generating Checksums ================"
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fravo-android-builds-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: 🚀 Publish Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
