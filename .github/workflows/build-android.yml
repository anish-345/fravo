name: Play Store Release Bundle Build & Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🚀 Build & Publish Play Store Release Bundle (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Set up Gradle & Dependency Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚡ Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 🔑 Restore Android Keystore & Key Properties
        env:
          RAW_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RAW_KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi

          # Sanitize secret inputs from trailing whitespaces/newlines
          KEYSTORE_PASSWORD=$(echo "$RAW_KEYSTORE_PASSWORD" | tr -d '\r\n ')
          KEY_PASSWORD=$(echo "$RAW_KEY_PASSWORD" | tr -d '\r\n ')
          KEY_ALIAS=$(echo "$RAW_KEY_ALIAS" | tr -d '\r\n ')

          # Decode keystore safely
          echo "$RAW_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/fravo-release.jks

          # Validate keystore integrity and alias
          keytool -list -keystore android/app/fravo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"
          echo "✅ Keystore restored and validated successfully."

          # Generate unindented android/key.properties
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=fravo-release.jks\n" \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

          echo "✅ android/key.properties configured successfully."

      - name: 📄 Restore google-services.json (if provided via secrets)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ google-services.json updated from GitHub Secrets."
          else
            echo "ℹ️ Using repository google-services.json."
          fi

      - name: 🔧 Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🛠️ Build Play Store Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: 🔍 Verify Signature & Stage Artifact
        run: |
          mkdir -p dist
          AAB_FILE="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::Build output $AAB_FILE not found!"
            exit 1
          fi

          echo "================ Verification Report ================"
          echo "Verifying certificate on $AAB_FILE..."
          keytool -printcert -jarfile "$AAB_FILE" | grep -E "Owner:|SHA256:|SHA1:" || true

          cp "$AAB_FILE" "dist/fravo-release.aab"
          echo "✅ Copied to dist/fravo-release.aab"

          cd dist
          sha256sum fravo-release.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: 🏷️ Resolve Release Tag & Version
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Fravo Release ${TAG}"
          else
            RAW_VERSION=$(grep '^version: ' pubspec.yaml | head -n1 | sed 's/version:[[:space:]]*//' | tr -d '\r')
            TAG_VERSION=$(echo "$RAW_VERSION" | sed 's/+/-b/')
            TAG="v${TAG_VERSION}"
            TITLE="Fravo Release v${RAW_VERSION}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: 🚀 Publish to GitHub Releases (Automatic)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 📱 ${{ steps.release_info.outputs.title }}
            Automated Google Play Store production release bundle (`.aab`).

            ### 📦 Included Files:
            - **`fravo-release.aab`**: Google Play Store Production App Bundle (Signed)
            - **`SHA256SUMS.txt`**: SHA-256 verification checksum

            ### 🔐 Certificate Signature:
            `CN=Fravo App, OU=Development, O=Avionti`
            SHA-256: `99:00:92:E0:BF:55:AD:3E:78:81:0E:72:6C:67:F0:A0:23:8A:EC:66:C6:F6:FB:9A:5C:FD:63:D5:8C:5D:DC:FB`
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Build Artifact to Actions (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: fravo-release-aab
          path: dist/
          retention-days: 30
